name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dcs_docs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci-only-password@127.0.0.1:5432/dcs_docs_ci_unused
      DATABASE_URL_TEST: postgresql://ci:ci-only-password@127.0.0.1:5432/dcs_docs_test
      CSRF_SECRET: ci-only-csrf-secret-ci-only-csrf-secret-0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: No unsafe raw SQL in application code
        # $queryRawUnsafe / $executeRawUnsafe bypass Prisma's parameter binding (SQL injection risk) if ever given
        # untrusted input. The convention is Prisma.sql tagged templates only; test fixtures (DB setup/teardown on
        # the test database) are the one documented exception and are not covered by this guard.
        run: |
          if grep -rn 'RawUnsafe' packages/api/src; then
            echo "::error::\$queryRawUnsafe/\$executeRawUnsafe found in packages/api/src — use Prisma.sql tagged templates instead."
            exit 1
          fi
      - run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --no-banner --redact

  # Report-only for now (no --error): findings are visible in the Actions log but do not fail the build.
  # Owner decision pending (docs/SECURITY-PLAN.md section 4) on when/whether to make this blocking.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: semgrep (OWASP Top 10 + TypeScript rules, report-only)
        run: docker run --rm -v "$PWD:/src" returntocorp/semgrep semgrep scan --config p/owasp-top-ten --config p/typescript /src
