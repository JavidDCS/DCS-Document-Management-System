# Example Nginx site for the DCS Documents SPA + API. PLACEHOLDERS ONLY: replace host names and paths.
# TLS certificates are issued/managed outside this file.

# Add this to the http {} block in nginx.conf (not valid inside a server block): a second, edge-level rate limit
# on sign-in traffic, on top of the app's own per-IP/per-account limiter (defense in depth, not a replacement).
# limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

server {
    listen 80;
    server_name docs.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name docs.example.internal;

    ssl_certificate     /etc/ssl/dcs-docs/fullchain.pem;
    ssl_certificate_key /etc/ssl/dcs-docs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/dcs-docs/web/dist;
    index index.html;

    # Uploads: documents are limited to 25 MB by default; leave headroom for multipart overhead.
    client_max_body_size 30m;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;

    # Sign-in and refresh/OAuth endpoints: an edge-level rate limit in addition to the app's own limiter.
    # Order matters: this location must come before the general /api/ location below.
    location ~ ^/api/v1/auth(/|$) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:7800;   # API_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }

    # API: the Node process listens on loopback only.
    location /api/ {
        proxy_pass http://127.0.0.1:7800;   # API_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
        # security headers are set by the API itself (a strict CSP, nosniff, no-store)
    }

    # Hashed assets can be cached for a long time; index.html must never be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Single-page app fallback
    location / {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Never serve storage or dotfiles
    location ~ /\. { deny all; }
}
